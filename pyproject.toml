[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-portal"
version = "0.1.0"
description = "Read-only, standard-library-only drill-down over everything a running Hermes agent keeps: ten domains of live data as pages and JSON, plus the skill framework it grew out of."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ron Malouin" }]
keywords = ["portal", "dashboard", "skills", "framework", "cli", "repl", "stdlib"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.scripts]
hermes = "hermes.cli.shell:main"
# `hermes-portal` is the canonical name.  The `hermes-deck` alias is retired: with
# the Skill Deck folded into the portal it was only a second name for this entry.
hermes-portal = "hermes.portal.server:main"

[tool.setuptools]
# Flat layout: the package lives at the project root exactly as specified.
packages = [
  "hermes",
  "hermes.core",
  "hermes.cli",
  "hermes.portal",
  "hermes.portal.domains",
]

[tool.setuptools.package-data]
# skill directories and profiles are data, not importable packages, so they
# have to be named explicitly for a wheel (or sdist) to carry them.
hermes = ["profiles/*.json", "skills/*/skill.json", "skills/*/*.py"]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = [".venv", "build", "dist", "*.egg-info"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "RET", "ARG", "PTH"]

[tool.ruff.lint.per-file-ignores]
# The base domain class declares the portal's four-callable contract and implements the
# permissive defaults; a subclass is what uses the parameters.
"hermes/portal/domains/base.py" = ["ARG002"]

[tool.ruff.format]
quote-style = "double"
